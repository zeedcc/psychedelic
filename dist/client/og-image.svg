<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a2f6e"/>
      <stop offset="100%" stop-color="#0B1739"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C9DD9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C9DD9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C9DD9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7C9DD9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glows -->
  <ellipse cx="200" cy="200" rx="320" ry="280" fill="url(#glow1)"/>
  <ellipse cx="1050" cy="450" rx="260" ry="220" fill="url(#glow2)"/>

  <!-- Stars -->
  <circle cx="120" cy="80" r="1.5" fill="#7C9DD9" opacity="0.7"/>
  <circle cx="340" cy="55" r="1" fill="#C9D6E8" opacity="0.5"/>
  <circle cx="580" cy="40" r="2" fill="#7C9DD9" opacity="0.6"/>
  <circle cx="820" cy="70" r="1" fill="#C9D6E8" opacity="0.4"/>
  <circle cx="1050" cy="50" r="1.5" fill="#7C9DD9" opacity="0.7"/>
  <circle cx="1150" cy="120" r="1" fill="#C9D6E8" opacity="0.5"/>
  <circle cx="60" cy="300" r="1" fill="#7C9DD9" opacity="0.4"/>
  <circle cx="1140" cy="280" r="1.5" fill="#7C9DD9" opacity="0.6"/>
  <circle cx="950" cy="160" r="1" fill="#C9D6E8" opacity="0.5"/>
  <circle cx="200" cy="500" r="1" fill="#7C9DD9" opacity="0.4"/>
  <circle cx="1100" cy="550" r="1.5" fill="#C9D6E8" opacity="0.5"/>
  <circle cx="450" cy="580" r="1" fill="#7C9DD9" opacity="0.4"/>
  <circle cx="700" cy="560" r="1" fill="#C9D6E8" opacity="0.3"/>

  <!-- Moon crescent -->
  <circle cx="1080" cy="100" r="38" fill="#7C9DD9" opacity="0.18"/>
  <circle cx="1095" cy="92" r="30" fill="#0B1739" opacity="0.9"/>

  <!-- Torii gate watermark (right side) -->
  <g opacity="0.06" transform="translate(950, 200)">
    <rect x="5" y="36" width="110" height="16" rx="8" fill="#C9D6E8"/>
    <rect x="12" y="20" width="96" height="12" rx="6" fill="#C9D6E8"/>
    <rect x="22" y="52" width="16" height="148" rx="8" fill="#C9D6E8"/>
    <rect x="82" y="52" width="16" height="148" rx="8" fill="#C9D6E8"/>
    <rect x="30" y="80" width="60" height="10" rx="5" fill="#C9D6E8"/>
  </g>

  <!-- Top shimmer line -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#glow1)" opacity="0.5"/>

  <!-- Eyebrow pill -->
  <rect x="480" y="195" width="240" height="34" rx="17" fill="#7C9DD9" fill-opacity="0.12" stroke="#7C9DD9" stroke-opacity="0.3" stroke-width="1"/>
  <text x="600" y="217" font-family="Georgia, serif" font-size="13" fill="#7C9DD9" text-anchor="middle" letter-spacing="2">✦ digital boutique</text>

  <!-- Main title -->
  <text x="600" y="295" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#E8EEF8" text-anchor="middle" letter-spacing="-1">Ethereal Psyche</text>

  <!-- Subtitle -->
  <text x="600" y="350" font-family="Georgia, serif" font-size="22" fill="#C9D6E8" text-anchor="middle" opacity="0.8">Dream Blue Moonlight Digital Boutique</text>

  <!-- Divider -->
  <line x1="480" y1="378" x2="720" y2="378" stroke="#7C9DD9" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Feature pills row -->
  <rect x="310" y="398" width="170" height="30" rx="15" fill="#111f4d" stroke="#1e3060" stroke-width="1"/>
  <text x="395" y="418" font-family="Arial, sans-serif" font-size="12" fill="#C9D6E8" text-anchor="middle" opacity="0.85">🎬 Entertainment</text>

  <rect x="495" y="398" width="170" height="30" rx="15" fill="#111f4d" stroke="#1e3060" stroke-width="1"/>
  <text x="580" y="418" font-family="Arial, sans-serif" font-size="12" fill="#C9D6E8" text-anchor="middle" opacity="0.85">📚 Educational</text>

  <rect x="680" y="398" width="170" height="30" rx="15" fill="#111f4d" stroke="#1e3060" stroke-width="1"/>
  <text x="765" y="418" font-family="Arial, sans-serif" font-size="12" fill="#C9D6E8" text-anchor="middle" opacity="0.85">🎨 Creative Tools</text>

  <!-- Tagline -->
  <text x="600" y="490" font-family="Arial, sans-serif" font-size="16" fill="#7C9DD9" text-anchor="middle" opacity="0.7">Affordable PHP-priced premium digital subscriptions · Delivered to your inbox</text>

  <!-- Bottom border glow -->
  <rect x="0" y="628" width="1200" height="2" fill="#7C9DD9" opacity="0.2"/>
</svg>
